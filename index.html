<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enlace</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1>Enlace</h1>
    <div class="controls" id="controls"></div>
    <details class="menu">
      <summary data-en="Project">Proyecto</summary>
      <div class="menu-panel" id="file"></div>
    </details>
    <details class="menu">
      <summary data-en="Settings">Ajustes</summary>
      <div class="menu-panel" id="options"></div>
    </details>
    <details class="menu">
      <summary>MIDI <span class="muted" id="midi-status"></span></summary>
      <div class="menu-panel" id="midi"></div>
    </details>
    <div class="lang" id="lang" role="group" aria-label="Idioma / Language"></div>
  </header>

  <nav class="tabbar">
    <div role="tablist" aria-label="Secciones" data-en-label="Sections" class="tabs">
      <span class="tab-item" role="presentation">
        <button role="tab" id="tab-btn-chords" data-act="tab" data-v="chords" aria-controls="tab-chords" aria-keyshortcuts="Tab" data-en="Progression">Progresión</button>
        <button class="tab-mute" id="mute-chords" data-act="toggle-chords"></button>
        <button class="tab-solo" id="solo-chords" data-act="solo" data-v="chords">S</button>
      </span>
      <span class="tab-item" role="presentation">
        <button role="tab" id="tab-btn-melody" data-act="tab" data-v="melody" aria-controls="tab-melody" aria-keyshortcuts="Tab" data-en="Melody">Melodía</button>
        <button class="tab-mute" id="mute-melody" data-act="toggle-melody"></button>
        <button class="tab-solo" id="solo-melody" data-act="solo" data-v="melody">S</button>
      </span>
      <span class="tab-item" role="presentation">
        <button role="tab" id="tab-btn-bass" data-act="tab" data-v="bass" aria-controls="tab-bass" aria-keyshortcuts="Tab" data-en="Bass">Bajo</button>
        <button class="tab-mute" id="mute-bass" data-act="toggle-bass"></button>
        <button class="tab-solo" id="solo-bass" data-act="solo" data-v="bass">S</button>
      </span>
      <span class="tab-item" role="presentation">
        <button role="tab" id="tab-btn-drums" data-act="tab" data-v="drums" aria-controls="tab-drums" aria-keyshortcuts="Tab" data-en="Drums">Percusión</button>
        <button class="tab-mute" id="mute-drums" data-act="toggle-drums"></button>
        <button class="tab-solo" id="solo-drums" data-act="solo" data-v="drums">S</button>
      </span>
      <span class="tab-item" role="presentation">
        <button role="tab" id="tab-btn-letra" data-act="tab" data-v="letra" aria-controls="tab-letra" aria-keyshortcuts="Tab" data-en="Lyrics">Letra</button>
      </span>
      <span class="tab-item" role="presentation">
        <button role="tab" id="tab-btn-voice" data-act="tab" data-v="voice" aria-controls="tab-voice" aria-keyshortcuts="Tab" data-en="Voice">Voz</button>
        <button class="tab-mute" id="mute-voice" data-act="toggle-voice"></button>
        <button class="tab-solo" id="solo-voice" data-act="solo" data-v="voice">S</button>
      </span>
      <kbd title="Pulsa el tabulador para cambiar de pestaña" data-en-title="Press Tab to switch tabs">⇥</kbd>
    </div>
    <div class="transport" id="transport"></div>
  </nav>

  <input type="file" id="file-input" accept=".json,application/json" hidden>
  <main>
    <div class="tab tab-chords" id="tab-chords" role="tabpanel" aria-labelledby="tab-btn-chords">
      <section class="strip" aria-label="Progresión" data-en-label="Progression" id="strip"></section>
      <div class="work">
        <section class="panel next" aria-label="Siguiente acorde" data-en-label="Next chord" id="next"></section>
        <div class="side">
          <section class="panel" aria-label="Acorde seleccionado" data-en-label="Selected chord" id="detail"></section>
          <section class="panel" aria-label="Acordes de la escala" data-en-label="Chords in the scale" id="field"></section>
          <section class="panel presets-panel" aria-label="Progresiones conocidas" data-en-label="Well-known progressions" id="presets"></section>
        </div>
      </div>
    </div>

    <div class="tab tab-melody" id="tab-melody" role="tabpanel" aria-labelledby="tab-btn-melody">
      <section class="panel melody" aria-label="Melodía" data-en-label="Melody" id="melody"></section>
    </div>

    <div class="tab tab-bass" id="tab-bass" role="tabpanel" aria-labelledby="tab-btn-bass">
      <section class="panel melody" aria-label="Bajo" data-en-label="Bass" id="bass"></section>
    </div>

    <div class="tab tab-drums" id="tab-drums" role="tabpanel" aria-labelledby="tab-btn-drums">
      <section class="panel wheel-panel" aria-label="Rueda de ritmos" data-en-label="Rhythm wheel" id="wheel"></section>
      <section class="panel rings-panel" aria-label="Anillos" data-en-label="Rings" id="rings"></section>
    </div>

    <div class="tab tab-letra" id="tab-letra" role="tabpanel" aria-labelledby="tab-btn-letra">
      <section class="panel letra-head" aria-label="Estrofas y letra" data-en-label="Verses and lyrics" id="letra-head"></section>
      <section class="panel melody letra-grid" aria-label="Melodía de la voz" data-en-label="Voice melody" id="letra-grid"></section>
    </div>

    <div class="tab tab-voice" id="tab-voice" role="tabpanel" aria-labelledby="tab-btn-voice">
      <section class="panel song-panel" aria-label="Canción" data-en-label="Song" id="song"></section>
      <section class="panel voice-panel" aria-label="Voz" data-en-label="Voice" id="voice"></section>
    </div>
  </main>

  <footer class="timeline" id="timeline" aria-label="Línea de tiempo" data-en-label="Timeline"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/theory.js"></script>
  <script src="js/suggest.js"></script>
  <script src="js/voicings.js"></script>
  <script src="js/melody.js"></script>
  <script src="js/bass.js"></script>
  <script src="js/drums.js"></script>
  <script src="js/diagrams.js"></script>
  <script src="js/spanish.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/voz-wasm.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/midi.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
