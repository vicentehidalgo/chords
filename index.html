<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enlace · acordes y melodías</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Enlace</h1>
      <p>Encadena acordes y construye melodías sobre ellos</p>
    </div>
    <div class="controls" id="controls"></div>
  </header>

  <main>
    <section class="strip" aria-label="Progresión" id="strip"></section>
    <section class="midi" aria-label="Salida MIDI" id="midi"></section>

    <div class="columns">
      <section class="panel" aria-label="Siguiente acorde" id="next"></section>
      <section class="panel" aria-label="Acorde seleccionado" id="detail"></section>
    </div>

    <section class="panel" aria-label="Melodía" id="melody"></section>

    <div class="columns even">
      <section class="panel" aria-label="Acordes de la escala" id="field"></section>
      <section class="panel" aria-label="Progresiones conocidas" id="presets"></section>
    </div>
  </main>

  <script src="js/theory.js"></script>
  <script src="js/suggest.js"></script>
  <script src="js/voicings.js"></script>
  <script src="js/melody.js"></script>
  <script src="js/diagrams.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/midi.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
