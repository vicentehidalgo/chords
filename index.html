<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enlace · acordes y melodías</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1>Enlace</h1>
    <div class="controls" id="controls"></div>
    <details class="menu">
      <summary>Ajustes</summary>
      <div class="menu-panel" id="options"></div>
    </details>
    <details class="menu">
      <summary>MIDI <span class="muted" id="midi-status"></span></summary>
      <div class="menu-panel" id="midi"></div>
    </details>
  </header>

  <nav class="tabbar">
    <div role="tablist" aria-label="Secciones" class="tabs">
      <button role="tab" id="tab-btn-chords" data-act="tab" data-v="chords" aria-controls="tab-chords" aria-keyshortcuts="Tab">Progresión</button>
      <button role="tab" id="tab-btn-melody" data-act="tab" data-v="melody" aria-controls="tab-melody" aria-keyshortcuts="Tab">Melodía</button>
      <button role="tab" id="tab-btn-drums" data-act="tab" data-v="drums" aria-controls="tab-drums" aria-keyshortcuts="Tab">Percusión</button>
      <kbd title="Pulsa el tabulador para cambiar de pestaña">⇥</kbd>
    </div>
    <div class="transport" id="transport"></div>
  </nav>

  <main>
    <div class="tab tab-chords" id="tab-chords" role="tabpanel" aria-labelledby="tab-btn-chords">
      <section class="strip" aria-label="Progresión" id="strip"></section>
      <div class="work">
        <section class="panel next" aria-label="Siguiente acorde" id="next"></section>
        <div class="side">
          <section class="panel" aria-label="Acorde seleccionado" id="detail"></section>
          <section class="panel" aria-label="Acordes de la escala" id="field"></section>
          <section class="panel presets-panel" aria-label="Progresiones conocidas" id="presets"></section>
        </div>
      </div>
    </div>

    <div class="tab tab-melody" id="tab-melody" role="tabpanel" aria-labelledby="tab-btn-melody">
      <section class="panel melody" aria-label="Melodía" id="melody"></section>
      <section class="panel" aria-label="Notas sobre el acorde" id="melody-map"></section>
    </div>

    <div class="tab tab-drums" id="tab-drums" role="tabpanel" aria-labelledby="tab-btn-drums">
      <section class="panel wheel-panel" aria-label="Rueda de ritmos" id="wheel"></section>
      <section class="panel rings-panel" aria-label="Anillos" id="rings"></section>
    </div>
  </main>

  <script src="js/theory.js"></script>
  <script src="js/suggest.js"></script>
  <script src="js/voicings.js"></script>
  <script src="js/melody.js"></script>
  <script src="js/drums.js"></script>
  <script src="js/diagrams.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/midi.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
